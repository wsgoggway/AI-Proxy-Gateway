# Daily backup for PostgreSQL and CA certificates
# Run: ansible-playbook -i inventory.ini backup.yml

- name: Create backup directory
  file:
    path: "{{ backup_dir | default('/opt/ai-proxy/backups') }}"
    state: directory
    mode: "0700"

- name: Backup PostgreSQL database
  shell: |
    pg_dump {{ db_name | default('ai_proxy') }} | gzip > {{ backup_dir | default('/opt/ai-proxy/backups') }}/ai_proxy_$(date +%Y%m%d_%H%M).sql.gz
  environment:
    PGPASSWORD: "{{ db_pass | default('changeme') }}"
  register: pg_backup

- name: Backup CA certificates
  copy:
    src: /opt/ai-proxy/certs/
    dest: "{{ backup_dir | default('/opt/ai-proxy/backups') }}/certs_{{ ansible_date_time.date }}/"
    mode: "0600"
  failed_when: false

- name: Rotate backups older than 30 days
  shell: |
    find {{ backup_dir | default('/opt/ai-proxy/backups') }} -name '*.sql.gz' -mtime +30 -delete
    find {{ backup_dir | default('/opt/ai-proxy/backups') }} -name 'certs_*' -type d -mtime +30 -exec rm -rf {} \;
  changed_when: false
