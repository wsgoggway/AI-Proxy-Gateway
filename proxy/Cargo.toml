[package]
name = "ai-proxy"
version = "1.1.0"
edition = "2024"
description = "Корпоративный безопасный AI-прокси"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
flate2 = "1"
http-body-util = "0.1"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
tokio-rustls = "0.26"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x509-parser = "0.17"
anyhow = "1"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
aho-corasick = "1"
regex = "1"
once_cell = "1"
sha2 = "0.10"
hex = "0.4"
lru = "0.12"
prometheus = "0.13"
uuid = { version = "1", features = ["v4", "serde"] }
jsonwebtoken = "9"
redis = { version = "0.27", features = ["tokio-comp", "aio"] }
url = "2"
rcgen = { version = "0.13", features = ["pem"] }
time = { version = "0.3", features = ["macros"] }
base64 = "0.22"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "migrate", "uuid", "json", "derive", "macros"] }
pbkdf2 = "0.12"
hmac = "0.12"
rand_core = { version = "0.6", features = ["std", "getrandom"] }
subtle = "2"
bytes = "1"
tokio-stream = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
base64 = "0.22"
